name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# One pinned Linux job: the checker, its tests, the native examples, the
# committed absorbed libraries (no Lean, Rocq or Metamath tool is run), the
# known Rocq Init baseline, and inputs that must be rejected for a stated
# reason. See tools/ci.sh, which runs the same stages locally.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Pinned toolchain. Almide is built from an exact commit of its source
      # (no release carries almide/almide#3443 yet), with its lockfile and
      # the Rust release below; the commit id names the source, and the
      # built binary's checksum is logged. Arlk works around known Almide
      # code-generation bugs (listed in the README) as found in this build.
      ALMIDE_REPO: https://github.com/almide/almide
      ALMIDE_COMMIT: 963df767bc9c1ef7f4e7cc3d6f0662073e66baec
      RUST_VERSION: 1.96.1
      # Source tests run on WASM where the compiler lowers them, as on a
      # developer machine with wasmtime; tools/toolchain-check.sh also runs
      # every test file natively and counts both.
      WASMTIME_VERSION: v47.0.2
      WASMTIME_SHA256: 9ec85751649139711b6a5061c4f48a41412bf9b1ab98a08b9924ca73f22ca575
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache the Almide build
        uses: actions/cache@v4
        with:
          path: ~/almide-src/target
          key: almide-${{ env.ALMIDE_COMMIT }}-rust-${{ env.RUST_VERSION }}-${{ runner.os }}

      - name: Build Almide at ${{ env.ALMIDE_COMMIT }}
        run: |
          mkdir -p ~/almide-src && cd ~/almide-src
          git init -q . 2>/dev/null || true
          git fetch -q --depth 1 "$ALMIDE_REPO" "$ALMIDE_COMMIT"
          git checkout -q --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ALMIDE_COMMIT"
          cargo build --release --locked
          mkdir -p "$HOME/.local/bin"
          cp target/release/almide "$HOME/.local/bin/almide"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/almide" --version
          sha256sum "$HOME/.local/bin/almide"

      - name: Install wasmtime ${{ env.WASMTIME_VERSION }} (checksum pinned)
        run: |
          curl -fsSL -o wasmtime.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  wasmtime.tar.xz" | sha256sum -c -
          tar xJf wasmtime.tar.xz -C "$HOME/.local/bin" --strip-components=1 "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime"
          "$HOME/.local/bin/wasmtime" --version

      - name: Check
        run: tools/ci.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.sha }}
          path: ci-logs/
